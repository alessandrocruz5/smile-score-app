services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smile
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smile"]
      interval: 5s
      timeout: 5s
      retries: 10

  scorer:
    build: ./apps/scorer
    ports:
      - "8000:8000"
    environment:
      SCORER_API_KEY: dev-scorer-key
      MAX_IMAGE_BYTES: "5000000"

volumes:
  pgdata:
